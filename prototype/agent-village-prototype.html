<title>Agent Village</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Układ: okrągłe miasteczko 3D na cały ekran; nad nim HUD: u góry nazwa, liczniki i kolejka próśb, na dole legenda, dziennik i kamera; panel robota po prawej (na telefonie od dołu) */
:root{
  --sky-top:#8fd0f2; --sky-bottom:#f1f7e8; --star:transparent;
  --panel:#ffffff; --glass:rgba(255,255,255,.93); --field:#f3f6f8;
  --ink:#1e2638; --muted:#5b6478; --line:#dbe1ea; --edge:#c9d2df; --edge-dark:#a3afc2;
  --accent:#3a5ce0; --accent-dark:#2640a8; --accent-ink:#ffffff; --accent-soft:#e6ebfc;
  --alert:#ffc93d; --alert-dark:#c28d0c; --alert-ink:#3b2a00; --alert-soft:#fff4d4;
  --ask:#62b0ff; --ask-dark:#2f7fcf; --ask-ink:#08243f; --ask-soft:#e3f1ff;
  --ok:#22a06b; --ok-dark:#177a50; --ok-ink:#ffffff; --danger:#d1433a; --danger-soft:#fde6e4;
  --robot-head:#eef1f6; --robot-screen:#1f2643; --robot-eye:#7ff3ff; --robot-limb:#9aa3b5;
  --font-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#0b1533; --sky-bottom:#2a3d68; --star:rgba(255,255,255,.85);
    --panel:#182133; --glass:rgba(24,33,51,.93); --field:#202c41;
    --ink:#e8eef8; --muted:#a0aec2; --line:#2e3c54; --edge:#35465f; --edge-dark:#0e1524;
    --accent:#86a4ff; --accent-dark:#4560c4; --accent-ink:#0b1533; --accent-soft:#25335a;
    --alert:#ffcf55; --alert-dark:#a87a10; --alert-ink:#3b2a00; --alert-soft:#3a3118;
    --ask:#7cbcff; --ask-dark:#3b7fc4; --ask-ink:#08243f; --ask-soft:#1e314a;
    --ok:#46c98a; --ok-dark:#28895a; --ok-ink:#062113; --danger:#ff7d72; --danger-soft:#3e2326;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-top:#0b1533; --sky-bottom:#2a3d68; --star:rgba(255,255,255,.85);
  --panel:#182133; --glass:rgba(24,33,51,.93); --field:#202c41;
  --ink:#e8eef8; --muted:#a0aec2; --line:#2e3c54; --edge:#35465f; --edge-dark:#0e1524;
  --accent:#86a4ff; --accent-dark:#4560c4; --accent-ink:#0b1533; --accent-soft:#25335a;
  --alert:#ffcf55; --alert-dark:#a87a10; --alert-ink:#3b2a00; --alert-soft:#3a3118;
  --ask:#7cbcff; --ask-dark:#3b7fc4; --ask-ink:#08243f; --ask-soft:#1e314a;
  --ok:#46c98a; --ok-dark:#28895a; --ok-ink:#062113; --danger:#ff7d72; --danger-soft:#3e2326;
  color-scheme:dark;
}

html,body{height:100%}
body{
  background:var(--sky-bottom);
  background-image:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
  color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.45;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1.6px 1.6px at 8% 14%,var(--star) 50%,transparent 52%),
    radial-gradient(1.2px 1.2px at 21% 31%,var(--star) 50%,transparent 52%),
    radial-gradient(1.8px 1.8px at 34% 9%,var(--star) 50%,transparent 52%),
    radial-gradient(1.2px 1.2px at 47% 22%,var(--star) 50%,transparent 52%),
    radial-gradient(1.6px 1.6px at 63% 12%,var(--star) 50%,transparent 52%),
    radial-gradient(1.2px 1.2px at 74% 28%,var(--star) 50%,transparent 52%),
    radial-gradient(1.8px 1.8px at 86% 8%,var(--star) 50%,transparent 52%),
    radial-gradient(1.2px 1.2px at 93% 24%,var(--star) 50%,transparent 52%),
    radial-gradient(1.4px 1.4px at 14% 44%,var(--star) 50%,transparent 52%),
    radial-gradient(1.4px 1.4px at 88% 41%,var(--star) 50%,transparent 52%);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1;cursor:grab}
#world.drag{cursor:grabbing}
#world.hover{cursor:pointer}
#tags{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}

/* ---------- karty i przyciski ---------- */
.card{
  background:var(--glass); border:2px solid var(--edge); border-radius:16px;
  box-shadow:0 4px 0 var(--edge-dark);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 16px;border-radius:12px;
  font-family:var(--font-display);font-weight:600;font-size:15px;white-space:nowrap;letter-spacing:.01em;
  background:var(--panel);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge-dark);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge-dark)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-dark);box-shadow:0 3px 0 var(--accent-dark)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-dark)}
.btn.ok{background:var(--ok);color:var(--ok-ink);border-color:var(--ok-dark);box-shadow:0 3px 0 var(--ok-dark)}
.btn.ok:active{box-shadow:0 1px 0 var(--ok-dark)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.small{min-height:34px;padding:0 12px;font-size:14px}

/* ---------- HUD ---------- */
.hud{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px));
}
.hud .card,.hud button,.hud details,.hud a{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{padding:11px 16px;max-width:360px;min-width:0}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.05;margin:0;letter-spacing:-.005em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;text-wrap:pretty}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.controls{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;justify-content:flex-end}
.stats{display:flex;align-items:center;gap:4px;padding:4px 5px}
.stat{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:10px;font-size:13px;color:var(--muted);background:none;border:0;white-space:nowrap}
.stat b{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.work{background:var(--ok)}
.dot.wait{background:var(--alert);box-shadow:0 0 0 2px var(--alert-dark) inset}
.dot.done{background:var(--edge-dark)}
.stat.waitbtn.on{background:var(--alert);color:var(--alert-ink)}
.stat.waitbtn.on b{color:var(--alert-ink)}
.stat.waitbtn:not(.on){cursor:default}
.queue{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:520px}
.qchip{
  display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;font-size:13px;
  background:var(--alert);color:var(--alert-ink);border:2px solid var(--alert-dark);box-shadow:0 3px 0 var(--alert-dark);
  max-width:100%;
}
.qchip.ask{background:var(--ask);color:var(--ask-ink);border-color:var(--ask-dark);box-shadow:0 3px 0 var(--ask-dark)}
.qchip .g{font-family:var(--font-display);font-weight:700;font-size:15px;width:22px;height:22px;display:grid;place-items:center;background:rgba(255,255,255,.6);border-radius:50%;line-height:1}
.qchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.qchip:active{transform:translateY(2px);box-shadow:none}

.bottom{display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.bl{display:flex;align-items:flex-end;gap:12px;min-width:0;flex:1 1 auto}
.legend{max-width:330px;min-width:0;padding:0}
.legend summary{list-style:none;cursor:pointer;padding:9px 16px;font-family:var(--font-display);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"+";font-size:19px;color:var(--muted)}
.legend[open] summary::after{content:"−"}
.legend ul{list-style:none;margin:0;padding:0 16px 6px;display:grid;gap:6px}
.legend li{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;font-size:13px;line-height:1.35}
.legend li b{font-weight:600}
.legend .d{color:var(--muted);font-size:12.5px}
.legend .sw{width:18px;height:18px;border-radius:50%;margin-top:1px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.legend .sw.g{display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:12px;box-shadow:none;border:2px solid}
.legend .sw.inl{display:inline-grid;width:16px;height:16px;font-size:11px;vertical-align:-3px;margin:0 2px 0 0}
.legend code{font-family:var(--font-mono);font-size:11.5px;background:var(--field);border:1px solid var(--line);border-radius:5px;padding:0 4px;white-space:nowrap}
.legend .note{font-size:12px;color:var(--muted);padding:8px 16px 11px;border-top:1px solid var(--line);margin:4px 0 0}
.feed{list-style:none;margin:0;padding:8px;display:grid;gap:2px;width:min(380px,100%);min-width:0}
.feed li button{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;background:none;border:0;padding:4px 7px;border-radius:9px;font-size:12.5px;color:var(--muted);min-width:0}
.feed li button:hover{background:var(--field)}
.feed li .who{color:var(--ink);font-weight:600;flex:none}
.feed li .what{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.feed li i{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.feed li.fresh{animation:fresh .5s ease}
@keyframes fresh{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cam{display:flex;gap:4px;padding:5px}
.cam button{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:none;border:2px solid transparent}
.cam button:hover{background:var(--field);border-color:var(--line)}
.cam svg{width:18px;height:18px}

.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lang{display:inline-flex;flex:none;padding:2px;border-radius:999px;background:var(--field);border:2px solid var(--edge)}
.lang button{border:0;background:none;padding:3px 9px;border-radius:999px;font-family:var(--font-display);font-weight:600;font-size:12.5px;line-height:1.2;color:var(--muted);letter-spacing:.03em}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lang button:not([aria-pressed="true"]):hover{color:var(--ink)}

/* ---------- etykiety nad robotami ---------- */
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;will-change:transform}
.tag .name{
  pointer-events:auto;display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-display);font-size:12.5px;font-weight:600;line-height:1;padding:4px 9px 4px 6px;border-radius:999px;
  background:var(--glass);border:1.5px solid var(--edge);color:var(--ink);white-space:nowrap;
}
.tag .name i{width:8px;height:8px;border-radius:50%}
.tag.sel .name{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tag.off{display:none}
.bubble{
  pointer-events:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1;
  background:var(--alert);color:var(--alert-ink);border:2.5px solid var(--alert-dark);box-shadow:0 3px 0 var(--alert-dark);
  position:relative;animation:hop 1s ease-in-out infinite;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:9px;height:9px;background:inherit;border-right:2.5px solid var(--alert-dark);border-bottom:2.5px solid var(--alert-dark);transform:translateX(-50%) rotate(45deg);border-radius:0 0 3px 0}
.bubble.ask{background:var(--ask);color:var(--ask-ink);border-color:var(--ask-dark);box-shadow:0 3px 0 var(--ask-dark)}
.bubble.ask::after{border-color:var(--ask-dark)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-7px) scale(1.04)}60%{transform:translateY(-6px) scale(1.04)}}
.pop{position:absolute;left:0;top:0;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--alert-ink);background:var(--alert);border:2px solid var(--alert-dark);border-radius:999px;padding:3px 11px;white-space:nowrap;animation:rise 1.6s ease-out forwards}
.pop.ok{background:var(--ok);color:var(--ok-ink);border-color:var(--ok-dark)}
.pop.no{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
@keyframes rise{0%{opacity:0;translate:-50% 6px;scale:.8}15%{opacity:1;scale:1}100%{opacity:0;translate:-50% -46px}}

/* ---------- panel robota ---------- */
.panel{
  position:fixed;z-index:5;
  top:var(--hud-top,96px);
  right:max(16px,env(safe-area-inset-right,0px));
  bottom:max(14px,env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100% - 32px));
  display:flex;flex-direction:column;background:var(--panel);
  animation:slide .24s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.p-head{display:flex;align-items:center;gap:12px;padding:14px 14px 12px;border-bottom:2px solid var(--line)}
.p-avatar{width:50px;height:50px;flex:none;position:relative}
.p-avatar .an{position:absolute;left:50%;top:3px;width:3px;height:10px;margin-left:-1.5px;background:var(--robot-limb);border-radius:2px}
.p-avatar .an::after{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--av-color)}
.p-avatar .hd{position:absolute;left:3px;right:3px;bottom:2px;height:36px;border-radius:10px;background:var(--robot-head);box-shadow:inset 0 -3px 0 rgba(0,0,0,.09),0 0 0 2px var(--av-color)}
.p-avatar .sc{position:absolute;left:6px;right:6px;top:6px;bottom:8px;border-radius:7px;background:var(--robot-screen);display:flex;align-items:center;justify-content:center;gap:7px}
.p-avatar .sc i{width:6px;height:10px;border-radius:3px;background:var(--robot-eye)}
.p-title{flex:1;min-width:0}
.p-title h2{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.05;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--muted)}
.pill.work{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.wait{background:var(--alert);color:var(--alert-ink);border-color:var(--alert-dark)}
.pill.ask{background:var(--ask);color:var(--ask-ink);border-color:var(--ask-dark)}
.pill.done{background:var(--field);color:var(--ok)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.p-body{flex:1;overflow:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:14px;min-height:0}
.p-body h3{margin:10px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.p-body p{margin:0;text-wrap:pretty}
.now{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13.5px;min-width:0}
.tool{font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--ink);color:var(--panel);flex:none}
.target{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere;min-width:0}
.where{color:var(--muted);font-size:12.5px}
.progress{height:8px;border-radius:999px;background:var(--field);border:1px solid var(--line);margin-top:9px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px}
.req{border-radius:14px;padding:12px;border:2px solid var(--alert-dark);background:var(--alert-soft);display:grid;gap:9px}
.req h3{margin:0;color:var(--ink);display:flex;align-items:center;gap:8px;letter-spacing:.06em}
.req h3 .g{font-family:var(--font-display);font-size:14px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--alert);color:var(--alert-ink);letter-spacing:0}
.req.ask{border-color:var(--ask-dark);background:var(--ask-soft)}
.req.ask h3 .g{background:var(--ask);color:var(--ask-ink)}
.req.done{border-color:var(--line);background:var(--field)}
.req code{display:block;font-family:var(--font-mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;overflow-wrap:anywhere}
.req .why{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}
input[type=text],textarea{
  width:100%;border:2px solid var(--line);border-radius:12px;background:var(--field);padding:8px 11px;font-size:14px;
}
textarea{resize:vertical;min-height:70px;line-height:1.4}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
.log li{display:flex;gap:7px;align-items:baseline;min-width:0}
.log li .target{font-size:12px}
.log li em{font-style:normal;color:var(--muted);font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
.log li.k-result{color:var(--muted);padding-left:14px}
.log li.k-user{color:var(--accent)}
.log li.k-agent{color:var(--ink)}
.log li.k-warn .tool{background:var(--alert);color:var(--alert-ink)}
.log li.k-ask{color:var(--ask-dark)}
.log li.k-done{color:var(--ok);font-weight:600}
.log li b{font-weight:600;flex:none}
.p-foot{border-top:2px solid var(--line);padding:12px 14px;display:grid;gap:10px}
.p-actions{display:flex;gap:8px}
.p-actions .btn{flex:1}

/* ---------- okno nowego robota ---------- */
.backdrop{
  position:fixed;inset:0;z-index:10;background:rgba(10,18,36,.38);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
}
.dialog{width:min(460px,100%);background:var(--panel);padding:18px;display:grid;gap:10px;animation:slide .2s ease}
.dialog h2{font-family:var(--font-display);font-weight:700;font-size:24px;margin:0}
.dialog p{margin:0;color:var(--muted);font-size:13px}
.dialog label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest button{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--field);border:1.5px solid var(--line);text-align:left}
.suggest button:hover{border-color:var(--accent)}
.dialog .row{justify-content:flex-end;margin-top:6px}
.dialog .row .btn{flex:0 0 auto}

#nogl{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:24px;text-align:center}
#nogl div{max-width:420px;padding:18px}

@media (max-width: 1100px){
  body.panel-open .feed{display:none}
}
@media (min-width: 721px){
  body.panel-open .bottom{padding-right:calc(min(380px,100% - 32px) + 12px)}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = $('#world');

function noGL(){ $('#nogl').hidden = false; }
if (!window.THREE) { noGL(); return; }
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); }
catch (e) { noGL(); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);

/* ---------- narzędzia ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R = mulberry32(19102026);
const rnd = (a,b) => a + (b-a)*Math.random();
const rint = (a,b) => Math.floor(rnd(a, b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const rpick = arr => arr[Math.floor(R()*arr.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const angDiff = (a,b) => { let d = (a-b) % (Math.PI*2); if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2; return d; };
const dist2 = (x1,z1,x2,z2) => Math.hypot(x1-x2, z1-z2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const deg = d => d*Math.PI/180;
const pol = (r, phi) => [Math.sin(deg(phi))*r, Math.cos(deg(phi))*r];

/* ---------- materiały kreskówkowe ---------- */
const grad = new THREE.DataTexture(new Uint8Array([125,125,125,255, 195,195,195,255, 255,255,255,255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.generateMipmaps = false; grad.needsUpdate = true;
const toonCache = {}, basicCache = {};
function toon(c){ return toonCache[c] || (toonCache[c] = new THREE.MeshToonMaterial({color:c, gradientMap:grad})); }
function toonNew(c, o){ return new THREE.MeshToonMaterial(Object.assign({color:c, gradientMap:grad}, o||{})); }
function basic(c){ return basicCache[c] || (basicCache[c] = new THREE.MeshBasicMaterial({color:c})); }
const winMat = toonNew('#3d4f7a', {emissive:0x000000});
const lampMat = toonNew('#fff4cc', {emissive:0x000000});
const fireMat = new THREE.MeshBasicMaterial({color:0xff8a2a});

const scene = new THREE.Scene();
function mesh(geo, mat, x, y, z, parent, opt){
  const m = new THREE.Mesh(geo, typeof mat === 'string' ? toon(mat) : mat);
  m.position.set(x||0, y||0, z||0);
  m.castShadow = !(opt && opt.noCast); m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}
const cyl = (rt, rb, h, s, open, ts, tl) => new THREE.CylinderGeometry(rt, rb, h, s||28, 1, !!open, ts||0, tl===undefined ? Math.PI*2 : tl);
const sph = (r, w, h) => new THREE.SphereGeometry(r, w||22, h||16);
const box = (w,h,d) => new THREE.BoxGeometry(w,h,d);
function roundedBox(w,h,d,r){
  r = Math.min(r, w/2 - 1e-3, h/2 - 1e-3, d/2 - 1e-3);
  const iw = w - 2*r, ih = h - 2*r, cr = Math.min(iw, ih) * .3;
  const s = new THREE.Shape(), x = -iw/2, y = -ih/2;
  s.moveTo(x+cr, y); s.lineTo(x+iw-cr, y); s.quadraticCurveTo(x+iw, y, x+iw, y+cr);
  s.lineTo(x+iw, y+ih-cr); s.quadraticCurveTo(x+iw, y+ih, x+iw-cr, y+ih);
  s.lineTo(x+cr, y+ih); s.quadraticCurveTo(x, y+ih, x, y+ih-cr);
  s.lineTo(x, y+cr); s.quadraticCurveTo(x, y, x+cr, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(1e-3, d - 2*r), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:5 });
  g.center();
  return g;
}
// grupa ustawiona na okręgu, lokalne +z patrzy na środek miasteczka
function ringGroup(r, phi){ const g = new THREE.Group(); const p = pol(r, phi); g.position.set(p[0], 0, p[1]); g.rotation.y = deg(phi) + Math.PI; scene.add(g); return g; }
function localToWorld(g, x, y, z){ const v = new THREE.Vector3(x, y, z); g.updateMatrixWorld(true); return v.applyMatrix4(g.matrixWorld); }

/* ---------- światło ---------- */
const hemi = new THREE.HemisphereLight(0xe8f4ff, 0x7a9a5a, .55);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, .22);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff3dc, .8);
sun.position.set(-12, 24, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-20, right:20, top:20, bottom:-20, near:1, far:70 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0008;
if ('normalBias' in sun.shadow) sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);

/* ---------- mapa: stanowiska na okręgu ---------- */
const RING_R = 5.4, ENTRY_R = 7.3, ISLAND_R = 15;
const ST = {
  lib:    { id:'lib',    name:'Biblioteka',     phi:345, bR:10.6 },
  site:   { id:'site',   name:'Budowa',         phi:285, bR:10.3 },
  tower:  { id:'tower',  name:'Wieża radarowa', phi:225, bR:10.8 },
  forge:  { id:'forge',  name:'Kuźnia',         phi:165, bR:10.6 },
  charge: { id:'charge', name:'Ładowarka',      phi:45,  bR:10.0 },
};
const FACTORY = { phi:105, bR:10.9 };
Object.values(ST).concat([FACTORY]).forEach(s => { s.entry = pol(ENTRY_R, s.phi); s.center = pol(s.bR, s.phi); });
function slotAt(r, phi, look){ const p = pol(r, phi); return { x:p[0], z:p[1], face: look ? Math.atan2(look[0]-p[0], look[1]-p[1]) : deg(phi) + Math.PI, occ:null }; }
ST.lib.slots   = [-10, 0, 10].map(d => slotAt(8.4, ST.lib.phi + d, ST.lib.center));
ST.site.slots  = [-12, 0, 12].map(d => slotAt(8.25, ST.site.phi + d, ST.site.center)).concat([15, -15].map(d => slotAt(10.3, ST.site.phi + d, ST.site.center)));
ST.forge.slots = [-8, 8].map(d => slotAt(8.15, ST.forge.phi + d, pol(9.05, ST.forge.phi + d)));
ST.tower.slots = [-10, 0, 10].map(d => slotAt(8.4, ST.tower.phi + d, ST.tower.center));
ST.charge.slots = [-21, -7, 7, 21].map(d => { const s = slotAt(9.75, ST.charge.phi + d, null); s.pad = true; return s; });
FACTORY.door = pol(9.35, FACTORY.phi);

/* ---------- wyspa ---------- */
mesh(cyl(ISLAND_R, ISLAND_R, .6, 96), '#94d36c', 0, -.3, 0, null, {noCast:true});
const lip = mesh(new THREE.TorusGeometry(ISLAND_R, .32, 10, 96), '#83c25c', 0, -.3, 0, null, {noCast:true}); lip.rotation.x = Math.PI/2;
mesh(cyl(ISLAND_R + .05, ISLAND_R - .6, 1.1, 96), '#b98457', 0, -1.15, 0, null, {noCast:true});
const under = mesh(new THREE.ConeGeometry(ISLAND_R - .6, 7.5, 96, 1), '#9a6b47', 0, -5.45, 0, null, {noCast:true}); under.rotation.x = Math.PI;
[[-6,-4.5,7,1],[8,-5.5,-5,.8],[2,-7.5,3,.6],[-9,-3.2,-8,.7]].forEach(r => { const m = mesh(new THREE.DodecahedronGeometry(r[3]), '#8a8f9c', r[0], r[1], r[2], null, {noCast:true}); m.rotation.set(R()*3, R()*3, 0); });

// plac, rondo, ścieżki
mesh(cyl(3.6, 3.6, .06, 72), '#e6d4ae', 0, .03, 0, null, {noCast:true});
const plazaRing = mesh(new THREE.RingGeometry(2.4, 2.6, 72), '#d3bd92', 0, .065, 0, null, {noCast:true}); plazaRing.rotation.x = -Math.PI/2;
const road = mesh(new THREE.RingGeometry(4.75, 6.05, 96), '#f2e4c2', 0, .025, 0, null, {noCast:true}); road.rotation.x = -Math.PI/2;
const roadEdge = mesh(new THREE.RingGeometry(6.05, 6.2, 96), '#dcc9a0', 0, .028, 0, null, {noCast:true}); roadEdge.rotation.x = -Math.PI/2;
Object.values(ST).concat([FACTORY]).forEach(s => {
  const L = 3.2, p = pol(6 + L/2, s.phi);
  const m = mesh(new THREE.PlaneGeometry(1.25, L), '#f2e4c2', p[0], .026, p[1], null, {noCast:true});
  m.rotation.order = 'YXZ'; m.rotation.set(-Math.PI/2, deg(s.phi), 0);
});
// podłoże pod stanowiskami
[['site', 3.1, '#e2c493'], ['forge', 2.9, '#d9cfc2'], ['charge', 3.4, '#d8efe9'], ['lib', 2.9, '#ece4f8'], ['tower', 2.6, '#dfe5ee']].forEach(([id, r, c]) => {
  const p = ST[id].center; mesh(cyl(r, r, .05, 64), c, p[0], .03, p[1], null, {noCast:true});
});

/* ---------- fontanna ---------- */
mesh(cyl(1.75, 1.85, .45, 48), '#d8ccb6', 0, .225, 0);
mesh(cyl(1.5, 1.5, .06, 48), '#8fd3f4', 0, .44, 0, null, {noCast:true});
mesh(cyl(.22, .3, 1.1, 20), '#d8ccb6', 0, .95, 0);
mesh(cyl(.75, .32, .28, 32), '#e4d9c4', 0, 1.55, 0);
mesh(cyl(.62, .62, .04, 32), '#8fd3f4', 0, 1.68, 0, null, {noCast:true});
mesh(sph(.14, 14, 10), '#e4d9c4', 0, 1.82, 0);

/* ---------- biblioteka ---------- */
(function(){
  const g = ringGroup(ST.lib.bR, ST.lib.phi);
  mesh(cyl(2.2, 2.3, .3, 48), '#f1ecfb', 0, .15, 0, g);
  mesh(cyl(1.95, 1.95, 2.2, 48), '#b9a6ea', 0, 1.4, 0, g);
  mesh(cyl(2.08, 2.08, .2, 48), '#f6f2ff', 0, 2.58, 0, g);
  mesh(new THREE.SphereGeometry(1.95, 40, 18, 0, Math.PI*2, 0, Math.PI/2), '#7c5cd6', 0, 2.66, 0, g);
  mesh(cyl(.06, .06, .5, 8), '#ffd25e', 0, 4.8, 0, g);
  mesh(sph(.17, 16, 12), '#ffd25e', 0, 5.1, 0, g);
  mesh(roundedBox(.82, 1.15, .25, .08), '#4b3a7a', 0, .87, 1.9, g);
  const arch = mesh(cyl(.41, .41, .25, 20, false, 0, Math.PI), '#4b3a7a', 0, 1.42, 1.9, g); arch.rotation.order = 'ZYX'; arch.rotation.set(Math.PI/2, 0, Math.PI/2);
  [-100, -50, 50, 100, 150, 210].forEach(a => { const w = mesh(roundedBox(.34, .62, .1, .06), winMat, Math.sin(deg(a))*1.95, 1.62, Math.cos(deg(a))*1.95, g); w.rotation.y = deg(a); });
  mesh(cyl(1.0, 1.05, .12, 32), '#f1ecfb', 0, .06, 2.45, g);
})();

/* ---------- budowa: wieżowiec rośnie piętrami, obok dźwig ---------- */
const siteG = ringGroup(ST.site.bR, ST.site.phi);
const crane = { jib:null, hook:null, cable:null, block:null, base:0, dist:2.6 };
(function(){
  const cx = 2.3, cz = -1.3;
  mesh(roundedBox(1.1, .3, 1.1, .08), '#6f7787', cx, .15, cz, siteG);
  mesh(box(.34, 7.2, .34), '#ffc23d', cx, 3.6, cz, siteG);
  for (let y=.8; y<7; y+=.9) mesh(box(.36, .06, .36), '#e0a419', cx, y, cz, siteG, {noCast:true});
  const jib = new THREE.Group(); jib.position.set(cx, 7.25, cz); siteG.add(jib);
  mesh(box(5.6, .26, .3), '#ffc23d', 1.4, 0, 0, jib);
  mesh(box(.7, .5, .55), '#6f7787', -1.2, -.12, 0, jib);
  mesh(roundedBox(.62, .55, .62, .1), '#ff7a59', .2, -.42, 0, jib);
  const dx = -cx, dz = -cz;
  crane.base = Math.atan2(-dz, dx);
  crane.dist = Math.hypot(dx, dz);
  const cable = mesh(box(.03, 1, .03), '#3d4357', crane.dist, -.5, 0, jib, {noCast:true});
  const hook = new THREE.Group(); jib.add(hook);
  mesh(box(.18, .12, .18), '#3d4357', 0, 0, 0, hook);
  const block = mesh(roundedBox(.5, .38, .5, .06), '#ffe9c2', 0, -.3, 0, hook);
  crane.jib = jib; crane.cable = cable; crane.hook = hook; crane.block = block;
  jib.rotation.y = crane.base;
  [[-1.9, 1.9], [1.6, 2.2]].forEach(p => mesh(roundedBox(.5, .5, .5, .05), '#d6a46a', p[0], .25, p[1], siteG));
  mesh(roundedBox(.5, .5, .5, .05), '#d6a46a', -1.9, .75, 1.9, siteG);
  mesh(new THREE.ConeGeometry(.18, .5, 16), '#ff8a3d', -2.3, .25, .6, siteG);
})();
const SEG_WALL = cyl(1.5, 1.5, .44, 16, false, 0, Math.PI/2);
const SEG_WIN = cyl(1.53, 1.53, .15, 16, true, 0, Math.PI/2);
const FLOORS = 7, SEGS = FLOORS*4;
const site = {
  i: 0, items: [], doneT: 0, clearT: 0,
  add(n, instant){
    for (let k=0; k<n && this.i <= SEGS; k++){
      const g = new THREE.Group();
      if (this.i < SEGS){
        const fl = Math.floor(this.i/4), q = this.i % 4;
        const w = new THREE.Mesh(SEG_WALL, toon(fl % 2 ? '#fff3dc' : '#ffe6bd')); w.castShadow = w.receiveShadow = true; g.add(w);
        const win = new THREE.Mesh(SEG_WIN, winMat); win.position.y = .05; g.add(win);
        g.position.set(0, .08 + fl*.46 + .22, 0); g.rotation.y = q*Math.PI/2;
      } else {
        const c = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.3, 32), toon('#ff6b6b')); c.castShadow = true; g.add(c);
        const pole = new THREE.Mesh(cyl(.03, .03, .8, 6), toon('#3d4357')); pole.position.y = 1; g.add(pole);
        const flag = new THREE.Mesh(box(.42, .26, .02), basic('#ffc23d')); flag.position.set(.22, 1.25, 0); g.add(flag);
        g.position.set(0, .08 + FLOORS*.46 + .65, 0);
      }

const parts = [], pool = { sph:[], box:[] };
const pSph = sph(1, 8, 6), pBox = box(1, 1, 1);
function burst(x,y,z,color,n,o){
  o = o || {};
  if (reduceMotion) n = Math.ceil(n/3);
  const shape = o.shape === 'box' ? 'box' : 'sph';
  for (let i=0; i<n && parts.length < 450; i++){
    const m = pool[shape].pop() || new THREE.Mesh(shape === 'box' ? pBox : pSph);
    m.material = o.lit ? toon(color) : basic(color);
    const sp = o.speed || 1.6;
    m.position.set(x + (Math.random()-.5)*(o.spread||.1), y, z + (Math.random()-.5)*(o.spread||.1));
    m.rotation.set(Math.random()*3, Math.random()*3, 0);
    m.userData = { vx:(Math.random()-.5)*sp, vy:(o.up||1.5) + Math.random()*sp*.5, vz:(Math.random()-.5)*sp, life:(o.life||.6)*(0.7+Math.random()*.6), g:o.g===undefined?7:o.g, size:o.size||.06, smoke:!!o.smoke, shape };
    m.userData.max = m.userData.life;
    m.scale.setScalar(m.userData.size);
    scene.add(m); parts.push(m);
  }
}
function updateParticles(dt){
  for (let i=parts.length-1; i>=0; i--){
    const m = parts[i], u = m.userData;
    u.life -= dt;
    if (u.life <= 0){ scene.remove(m); parts.splice(i,1); pool[u.shape].push(m); continue; }
    m.position.x += u.vx*dt; m.position.y += u.vy*dt; m.position.z += u.vz*dt;
    u.vy -= u.g*dt;
    if (u.shape === 'box'){ m.rotation.x += dt*6; m.rotation.y += dt*5; }
    const k = u.life / u.max;
    if (u.smoke) m.scale.setScalar(u.size * (1 + (1-k)*1.8) * Math.min(1, k*3));
    else m.scale.setScalar(u.size * Math.min(1, k*2.5));
  }
}

  a.path = path.filter((p,i,arr) => i === 0 ? dist2(p[0],p[1],a.x,a.z) > .15 : dist2(p[0],p[1],arr[i-1][0],arr[i-1][1]) > .15);

/* ---------- przebieg zadania ---------- */
function startStep(a){
  const s = a.steps[a.si];
  if (!s){ finish(a); return; }
  if (s.tool === 'Ask'){
    a.phase = 'ask';
    addLog(a, {k:'ask', q:s.ask.q});
    feed(a, 'fAsk');
    changed(a);
    return;
  }
  const st = stationOf(s.tool);
  if (a.station === st && a.slot && !a.slot.extra){ beginStep(a); return; }
  const carry = a.lastTool && READ_TOOLS.has(a.lastTool) && st === 'site';
  travel(a, st, () => beginStep(a), carry);
  changed(a);
}
function beginStep(a){
  const s = a.steps[a.si];
  a.carry = false;
  if (s.perm && !s.granted){
    a.phase = 'wait';
    addLog(a, {k:'warn', tool:s.tool, target:s.target});
    feed(a, 'fPerm', {target:s.target});
    changed(a);
    return;
  }
  a.phase = 'work';
  a.dur = a.timer = (s.dur || DUR[s.tool] || 4) * rnd(.85, 1.2);
  addLog(a, {k:'tool', tool:s.tool, target:s.target, note:s.diff});
  feed(a, 'fTool', {tool:s.tool, target:s.target});
  changed(a);
}
function completeStep(a){
  const s = a.steps[a.si];
  if (s.result) addLog(a, {k:'result', v:s.result});
  if (EDIT_TOOLS.has(s.tool)){
    const m = (s.diff || '').match(/\d+/g);
    const n = m ? clamp(Math.round(m.reduce((x,y) => x + +y, 0) / 25), 1, 4) : 2;
    site.add(n);
  }
  a.lastTool = s.tool;
  a.si++;
  startStep(a);
}
function finish(a){
  if (!a.stopped){ addLog(a, {k:'done'}); feed(a, 'fDone'); }
  a.homeBound = true;
  travel(a, 'charge', () => { a.phase = a.stopped ? 'stopped' : 'done'; a.homeBound = false; if (!a.stopped) pop(a, 'popDone', 'ok'); changed(a); }, false);
  changed(a);
}
function later(a, sec, fn){ a.delay = sec; a.delayFn = fn; }

function allow(a){
  const s = a.steps[a.si]; if (!s || a.phase !== 'wait') return;
  s.granted = true;
  addLog(a, {k:'user', key:'lAllowed', vars:{target:s.target}});
  a.react = {kind:'cheer', t:0, dur:.9}; pop(a, 'popThanks', 'ok');
  a.phase = 'pause';
  later(a, .9, () => beginStep(a));
  changed(a);
}
function deny(a){
  const s = a.steps[a.si]; if (!s || a.phase !== 'wait') return;
  addLog(a, {k:'user', key:'lDenied', vars:{target:s.target}});
  a.react = {kind:'shake', t:0, dur:.9}; pop(a, 'popOther', 'no');
  a.phase = 'pause';
  later(a, 1, () => {
    if (s.alt){ a.steps[a.si] = Object.assign({}, s.alt); addLog(a, {k:'agent', key:'lAlt', vars:{target:s.alt.target}}); beginStep(a); }
    else { addLog(a, {k:'agent', key:'lSkip'}); a.si++; startStep(a); }
  });
  changed(a);
}
function answer(a, v){
  const s = a.steps[a.si]; if (!s || a.phase !== 'ask') return;
  if (typeof v === 'string'){ v = v.trim(); if (!v) return; }
  addLog(a, {k:'user', v:v});
  s.answer = v;
  a.react = {kind:'cheer', t:0, dur:.8}; pop(a, 'popSure', 'ok');
  a.phase = 'pause';
  later(a, .9, () => { addLog(a, {k:'agent', key:'lGotIt', vars:{answer:v}}); a.si++; startStep(a); });
  changed(a);
}
function stopAgent(a){
  if (a.phase === 'done' || a.phase === 'stopped') return;
  addLog(a, {k:'user', key:'lStopped'});
  feed(a, 'fStopped');
  a.stopped = true; a.si = a.steps.length; a.delay = 0; a.delayFn = null; a.react = null;
  finish(a);
}
function giveTask(a, text){
  text = text.trim(); if (!text) return;
  a.task = text; a.steps = genericSteps(text); a.si = 0; a.stopped = false; a.homeBound = false; a.lastTool = null;
  addLog(a, {k:'user', key:'lNewTask', vars:{task:text}});

}
function sendMessage(a, text){

const camera = new THREE.OrthographicCamera(-1,1,1,-1,.1,300);
const HOME = new THREE.Vector3(0, 0, -.6);
const cam = { az: Math.PI/4, azGoal: Math.PI/4, el: .64, zoom: 1, zoomGoal: 1, target: HOME.clone(), goal: HOME.clone() };
let W = 1, H = 1;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H, false);
  const aspect = W / H;
  const halfH = aspect < 1 ? Math.max(12.4, 9.8 / aspect) : Math.max(12.4, 17.2 / aspect);
  camera.left = -halfH*aspect; camera.right = halfH*aspect; camera.top = halfH; camera.bottom = -halfH;

}
function measureTop(){

  camera.lookAt(cam.target);

function pan(dx, dy){
  const upp = (camera.top - camera.bottom) / camera.zoom / H;
  const rx = Math.cos(cam.az), rz = -Math.sin(cam.az);
  const fx = -Math.sin(cam.az), fz = -Math.cos(cam.az);
  const k = 1 / Math.sin(cam.el);
  const mx = -dx*upp*rx + dy*upp*k*fx, mz = -dx*upp*rz + dy*upp*k*fz;
  const lim = 13;
  cam.goal.x = clamp(cam.goal.x + mx, -lim, lim); cam.goal.z = clamp(cam.goal.z + mz, -lim, lim);
  cam.target.x = clamp(cam.target.x + mx, -lim, lim); cam.target.z = clamp(cam.target.z + mz, -lim, lim);
}
const MINZ = .55, MAXZ = 2.8;
function zoomBy(f){ cam.zoomGoal = clamp(cam.zoomGoal * f, MINZ, MAXZ); }

function pickAgent(cx, cy){

}

  if (!p){
    const now = performance.now();
    if (now - lastHover > 70){ lastHover = now; canvas.classList.toggle('hover', !!pickAgent(e.clientX, e.clientY)); }
    return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1){
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 5){ canvas.classList.add('drag'); pan(dx, dy); if (follow) setFollow(false); }
  } else if (pointers.size === 2 && pinch){
    const [p1,p2] = [...pointers.values()];
    cam.zoomGoal = clamp(pinch.z * Math.hypot(p1.x-p2.x, p1.y-p2.y) / pinch.d, MINZ, MAXZ);
    moved = 99;
  }
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  canvas.classList.remove('drag');
  if (e.type === 'pointerup' && moved <= 5 && pointers.size === 0){
    const a = pickAgent(e.clientX, e.clientY);
    if (a) select(a, false); else if (selected) select(null);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY * .0015)); }, {passive:false});
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'Escape'){ if (!dlg.hidden) dlg.hidden = true; else select(null); }
  if (e.key === 'q' || e.key === 'Q') cam.azGoal -= Math.PI/4;
  if (e.key === 'e' || e.key === 'E') cam.azGoal += Math.PI/4;
});

/* ---------- motyw: dzień i noc ---------- */
const ringMat = new THREE.MeshBasicMaterial({color:0x3a5ce0, transparent:true, opacity:.9, depthWrite:false});
const selRing = new THREE.Mesh(new THREE.RingGeometry(.4, .55, 32), ringMat); selRing.rotation.x = -Math.PI/2; selRing.visible = false; scene.add(selRing);
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true; if (t === 'light') return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
let night = false;
function applyTheme(){
  night = isDark();
  hemi.intensity = night ? .34 : .55; hemi.color.set(night ? 0x8fa6d9 : 0xe8f4ff); hemi.groundColor.set(night ? 0x1b2838 : 0x7a9a5a);
  sun.intensity = night ? .38 : .8; sun.color.set(night ? 0x9fb6ec : 0xfff3dc);
  ambient.intensity = night ? .14 : .22;
  winMat.emissive.set(night ? 0xffbf55 : 0x000000);
  lampMat.emissive.set(night ? 0xffd27a : 0x2a2210);
  lampLights.forEach(l => l.intensity = night ? 1.1 : 0);
  cloudMat.color.set(night ? 0x8d9bbd : 0xffffff);
  ringMat.color.set(night ? 0x86a4ff : 0x3a5ce0);
}
applyTheme();
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
const mq = matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);

/* ---------- animacja robota ---------- */
const BULB = { wait: new THREE.Color('#ffd23f'), ask: new THREE.Color('#62b0ff'), charge: new THREE.Color('#5dffa0'), radar: new THREE.Color('#7fe8ff'), off: new THREE.Color('#3a3f52') };
const tmpC = new THREE.Color();
function animate(a, t, dt){
  const m = a.mesh;
  m.legL.rotation.set(0,0,0); m.legR.rotation.set(0,0,0);
  m.armL.rotation.set(0,0,0); m.armR.rotation.set(0,0,0);
  m.head.rotation.set(0,0,0); m.root.rotation.set(0,0,0); m.root.position.set(0,0,0); m.root.scale.set(1,1,1);
  m.ant.rotation.set(0,0,0);
  m.hammer.visible = false; m.crate.visible = false; m.tablet.visible = false;
  const tt = t + a.off;
  const st = a.phase === 'work' ? stationOf(a.steps[a.si].tool) : null;
  const charging = (a.phase === 'done' || a.phase === 'stopped');
  let eyeY = 1, eyeOffY = 0, bulb = null, bulbPulse = 0;

  if (a.phase === 'walk' || (a.phase === 'spawn' && a.path.length)){
    const ph = tt * 10.5, s = Math.sin(ph) * .62;
    m.legL.rotation.x = s; m.legR.rotation.x = -s;
    if (a.carry){ m.armL.rotation.x = m.armR.rotation.x = -1.35; m.armL.rotation.z = -.18; m.armR.rotation.z = .18; m.crate.visible = true; }
    else { m.armL.rotation.x = -s*.85; m.armR.rotation.x = s*.85; }
    m.root.position.y = Math.abs(Math.cos(ph)) * .06;
    const sq = Math.cos(ph*2) * .035; m.root.scale.set(1 - sq*.5, 1 + sq, 1 - sq*.5);
    m.root.rotation.z = Math.sin(ph) * .04;
    m.head.rotation.z = -Math.sin(ph) * .05;
    m.ant.rotation.x = -.25 + Math.sin(ph*2) * .12; m.ant.rotation.z = Math.sin(ph) * .18;
  } else if (a.phase === 'work' && (st === 'site' || st === 'forge')){
    const p = ((tt * (st === 'forge' ? 1.45 : 1.2)) % 1 + 1) % 1;
    const up = p < .62 ? ease(p/.62) : 1 - Math.pow((p-.62)/.38, 2);
    m.armR.rotation.x = -.45 - 2.15*up;
    m.armL.rotation.x = -.6; m.armL.rotation.z = -.15;
    m.root.rotation.x = .1 - up*.08;
    m.root.scale.set(1, 1 - (1-up)*.03, 1);
    m.head.rotation.x = .22;
    eyeOffY = -.02;
    m.hammer.visible = true;
    m.ant.rotation.x = Math.sin(tt*6) * .08 + (1-up)*.15;
    if (p < a.prevP){
      const fx = a.x + Math.sin(a.face)*.62, fz = a.z + Math.cos(a.face)*.62;
      if (st === 'forge') burst(fx, .6, fz, Math.random() < .5 ? '#ffb347' : '#ffe08a', 8, {speed:2.6, up:2.2, g:9, life:.5, size:.04});
      else burst(fx, .7, fz, '#fff1cc', 5, {speed:1.6, up:1.4, g:6, life:.5, size:.05, lit:true});
    }
    a.prevP = p;
  } else if (a.phase === 'work' && st === 'lib'){
    m.armL.rotation.x = m.armR.rotation.x = -1.05; m.armL.rotation.z = -.32; m.armR.rotation.z = .32;
    m.head.rotation.x = .38 + Math.sin(tt*1.2)*.05;
    m.head.rotation.y = Math.sin(tt*.7)*.12;
    eyeOffY = -.025;
    m.tablet.visible = true;
    m.root.position.y = Math.sin(tt*2)*.01;
    if (Math.random() < dt*1.2){ const fx = a.x + Math.sin(a.face)*.35, fz = a.z + Math.cos(a.face)*.35; burst(fx, .95, fz, '#8ff0ff', 1, {speed:.3, up:.6, g:-.2, life:1.0, size:.035}); }
  } else if (a.phase === 'work' && st === 'tower'){
    m.armR.rotation.x = -2.3; m.armR.rotation.z = .55;
    m.head.rotation.x = -.42; m.head.rotation.y = Math.sin(tt*.9) * .45;
    m.root.position.y = Math.abs(Math.sin(tt*2.2)) * .02;
    bulb = BULB.radar; bulbPulse = .5 + .5*Math.sin(tt*6);
    m.ant.rotation.z = Math.sin(tt*3)*.1;
  } else if (a.phase === 'wait' || a.phase === 'ask'){
    const w = Math.sin(tt*9);
    m.armR.rotation.z = -(2.5 + w*.38);
    m.armL.rotation.z = .12;
    m.root.position.y = Math.abs(Math.sin(tt*4.5)) * .07;
    m.root.scale.set(1, 1 + Math.abs(Math.sin(tt*4.5))*.03, 1);
    m.head.rotation.x = -.12; m.head.rotation.z = Math.sin(tt*4.5)*.06;
    eyeY = 1.25;
    bulb = a.phase === 'ask' ? BULB.ask : BULB.wait; bulbPulse = Math.sin(tt*10) > 0 ? 1 : .15;
    m.ant.rotation.z = w*.15;
  } else if (charging){
    m.root.position.y = -.035 + Math.sin(tt*1.6)*.008;
    m.root.scale.set(1, .97, 1);
    m.legL.rotation.x = -.18; m.legR.rotation.x = -.18; m.root.rotation.x = .1;
    m.armL.rotation.z = .12; m.armR.rotation.z = -.12; m.armL.rotation.x = m.armR.rotation.x = .1;
    m.head.rotation.x = .25 + Math.sin(tt*1.1)*.04;
    eyeY = a.phase === 'done' ? .22 : .5;
    bulb = BULB.charge; bulbPulse = .35 + .65*(.5 + .5*Math.sin(tt*2.5));
  } else {
    m.root.position.y = Math.sin(tt*2) * .012;
    m.armL.rotation.z = .06; m.armR.rotation.z = -.06;
    m.ant.rotation.z = Math.sin(tt*1.7) * .06;
  }
  if (a.react){
    a.react.t += dt;
    const k = a.react.t;
    if (a.react.kind === 'cheer'){ m.armR.rotation.set(0,0,-2.75); m.armL.rotation.set(0,0,2.75); m.root.position.y = Math.abs(Math.sin(k*9))*.22; m.root.scale.set(1, 1 + Math.sin(k*18)*.05, 1); eyeY = .4; }
    else if (a.react.kind === 'shake'){ m.head.rotation.y = Math.sin(k*24)*.45; m.armL.rotation.set(0,0,.1); m.armR.rotation.set(0,0,-.1); eyeY = .7; }
    if (a.react.t >= a.react.dur) a.react = null;
  }
  // mruganie
  a.blinkT -= dt;
  if (a.blinkT <= 0){ a.blink = .13; a.blinkT = 2.5 + Math.random()*3; }
  if (a.blink > 0){ a.blink -= dt; eyeY = Math.min(eyeY, .12); }
  m.eyeL.scale.set(1, eyeY, 1); m.eyeR.scale.set(1, eyeY, 1);
  m.eyeL.position.y = m.eyeR.position.y = .245 + eyeOffY;
  // żarówka na antenie
  if (bulb){ tmpC.copy(BULB.off).lerp(bulb, bulbPulse); m.bulbM.color.copy(tmpC); }
  else m.bulbM.color.set(a.color);
  m.dotM.color.set(Math.sin(tt*3) > 0 ? 0xff6b6b : 0x5a2b2b);
  m.dot2.color.set(Math.sin(tt*2.3 + 1) > 0 ? 0x5dffa0 : 0x1f4a33);

  let sc = 1;
  if (a.spawnT > 0){ a.spawnT = Math.max(0, a.spawnT - dt); const k = 1 - a.spawnT/.7; sc = Math.max(.01, 1 + 2.4*Math.pow(k-1,3) + 1.4*Math.pow(k-1,2)); }
  m.g.scale.setScalar(sc);
  m.g.position.set(a.x, (charging && a.slot && a.slot.pad) ? .12 : 0, a.z);
  m.g.rotation.y = a.face;
}

function updateAgent(a, dt){
  if (a.delay > 0){ a.delay -= dt; if (a.delay <= 0 && a.delayFn){ const f = a.delayFn; a.delayFn = null; f(); } }
  if (a.phase === 'walk' && a.path.length){
    const tgt = a.path[0];
    const dx = tgt[0]-a.x, dz = tgt[1]-a.z, d = Math.hypot(dx,dz), step = (a.carry ? 1.9 : 2.3) * dt;
    if (d > .001) a.faceGoal = Math.atan2(dx, dz);
    if (d <= step){ a.x = tgt[0]; a.z = tgt[1]; a.path.shift(); }
    else { a.x += dx/d*step; a.z += dz/d*step; }
    if (!a.path.length){ a.faceGoal = a.slot ? a.slot.face : a.faceGoal; const f = a.onArrive; a.onArrive = null; if (f) f(); }
  } else if (a.phase === 'work'){
    a.timer -= dt;
    if (a.slot) a.faceGoal = a.slot.face;
    if (a.timer <= 0) completeStep(a);
  } else if (a.phase === 'wait' || a.phase === 'ask'){
    a.faceGoal = cam.az;
  } else if (a.slot && (a.phase === 'done' || a.phase === 'stopped')){
    a.faceGoal = a.slot.face;
  }
  a.face += angDiff(a.faceGoal, a.face) * Math.min(1, dt*8);
}

/* ---------- pozycje na ekranie ---------- */
const v3 = new THREE.Vector3();
function screenPos(a, h){
  v3.set(a.x, (h || 1.9), a.z).project(camera);
  return { x: (v3.x + 1) / 2 * W, y: (1 - v3.y) / 2 * H, vis: v3.z < 1 && v3.z > -1 };
}

/* ---------- pętla ---------- */
const clock = new THREE.Clock();
let smokeT = 0, uiT = 0, fountainT = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  cam.az += (cam.azGoal - cam.az) * Math.min(1, dt*5);
  cam.zoom += (cam.zoomGoal - cam.zoom) * Math.min(1, dt*8);
  if (follow && selected) cam.goal.set(selected.x, 0, selected.z);
  cam.target.lerp(cam.goal, Math.min(1, dt*4));
  placeCamera();

  let forging = 0, searching = 0, building = 0;
  agents.forEach(a => {
    updateAgent(a, dt);
    animate(a, t, dt);
    if (a.phase === 'work'){ const s = stationOf(a.steps[a.si].tool); if (s === 'forge') forging++; if (s === 'tower') searching++; if (s === 'site') building++; }
  });

  // kuźnia
  forgeLight.intensity = (night ? 1.2 : .55) + forging*.7 + Math.sin(t*17)*.08 + Math.sin(t*7.3)*.1;
  fireMat.color.setHSL(.07 + Math.sin(t*9)*.012, 1, .55 + forging*.04);
  // radar
  radar.head.rotation.y += dt * (searching ? 2.6 : .5);
  radar.light.material.color.set(Math.sin(t*4) > .6 ? 0xff4d4d : 0x5a1f1f);
  radar.ringT -= dt;
  if (searching && radar.ringT <= 0){
    radar.ringT = .7;
    const r = radar.rings.find(x => x.t >= 1); if (r){ r.t = 0; r.m.visible = true; r.m.position.copy(radar.pos); }
  }
  radar.rings.forEach(r => { if (r.t < 1){ r.t = Math.min(1, r.t + dt*.7); const s = .6 + r.t*4.2; r.m.scale.set(s, s, s); r.m.material.opacity = (1 - r.t) * .75; if (r.t >= 1) r.m.visible = false; } });
  // dźwig
  const targetJib = crane.base + (building ? Math.sin(t*.55)*.45 : Math.sin(t*.18)*.18);
  crane.jib.rotation.y += (targetJib - crane.jib.rotation.y) * Math.min(1, dt*2);
  const hookY = Math.max(site.height() + 1.2, 1.6) - 7.25 + (building ? Math.sin(t*1.1)*.45 : 0);
  const trolley = crane.dist + Math.sin(t*.4)*.15;
  crane.hook.position.set(trolley, hookY, 0);
  crane.hook.rotation.z = Math.sin(t*1.3)*.05;
  crane.cable.position.set(trolley, hookY/2, 0); crane.cable.scale.y = Math.max(.05, -hookY);
  crane.block.visible = building > 0;
  // fabryka
  gear.rotation.z += dt * .8;
  // ładowarka
  pads.forEach(p => {
    const occ = p.s.occ && (p.s.occ.phase === 'done' || p.s.occ.phase === 'stopped');
    p.t = occ ? (p.t + dt*.08) % 1 : 0;
    p.ringM.color.set(occ ? (Math.sin(t*3) > -.3 ? 0x5dffa0 : 0x2f8a5a) : 0x3a6b5a);
    p.bar.scale.x = occ ? .25 + p.t*.75 : .08;
    p.bar.position.x = (p.bar.scale.x - 1) * .12;
  });
  // fontanna
  fountainT -= dt;
  if (fountainT <= 0){ fountainT = reduceMotion ? .3 : .07; burst(0, 1.85, 0, '#9fdcff', 1, {speed:1.2, up:2.1, g:5.5, life:.85, size:.05}); }
  // drzewa
  crowns.forEach(c => { c.c.rotation.z = Math.sin(t*1.1 + c.off) * .035; c.c.rotation.x = Math.cos(t*.9 + c.off) * .025; });
  // dym
  smokeT -= dt;
  if (smokeT <= 0){
    smokeT = reduceMotion ? 1.6 : .5;
    CHIMNEYS.forEach((c, i) => { if (i === 0 || Math.random() < .55) burst(c.x, c.y, c.z, night ? '#7d8597' : '#e6e6e6', 1, {speed:.22, up:.65, g:-.05, life: i === 0 && forging ? 3 : 2.4, size:.26, smoke:true, lit:true}); });
  }
  updateParticles(dt);
  site.update(dt);
  clouds.forEach(c => { const u = c.userData; u.ang += u.spd*dt; c.position.set(Math.cos(u.ang)*u.rad, u.y + Math.sin(t*.3 + u.ang)*.3, Math.sin(u.ang)*u.rad); c.rotation.y = -u.ang; });

  if (selected){ selRing.visible = true; selRing.position.set(selected.x, .06, selected.z); const s = 1 + Math.sin(t*4)*.07; selRing.scale.set(s,s,s); }
  else selRing.visible = false;

  renderer.render(scene, camera);

  agents.forEach(a => {
    const p = screenPos(a);
    const vis = p.vis && p.x > -40 && p.x < W+40 && p.y > -60 && p.y < H+60;
    a.tag.classList.toggle('off', !vis);
    if (vis) a.tag.style.transform = 'translate3d(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px,0) translate(-50%,-100%)';
  });

  if (queueDirty) renderQueue();
  uiT -= dt;
  if (uiT <= 0 && selected){ uiT = .25; renderPanel(false); }
  if (selected && selected.phase === 'work') $('#pProg').style.width = (100 * (1 - selected.timer / selected.dur)).toFixed(1) + '%';

  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
if (window.innerWidth <= 720 || window.innerHeight < 760) $('#legend').open = false;
resize();
renderQueue();
placeCamera();
requestAnimationFrame(frame);
})();
</script>
